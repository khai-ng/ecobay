services:
    ##########################################
    ## Kafka
    ##########################################
    kafka-ui:
        profiles: [ kafka, all ]
        container_name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        depends_on:
            kafka:
                condition: service_healthy
            zookeeper:
                condition: service_healthy
        networks:
            - local

    zookeeper:
        profiles: [ kafka, minimal-workflow, all ]
        container_name: zookeeper
        image: confluentinc/cp-zookeeper:7.6.0
        healthcheck:
            test: echo ruok | nc 127.0.0.1 2181 || exit -1
            interval: 10s
            timeout: 10s
            retries: 3
        networks:
            - local
 
    kafka:
        profiles: [ kafka, minimal-workflow, all ]
        container_name: kafka
        image: confluentinc/cp-kafka:7.6.0
        healthcheck:
            test: nc -z localhost 9092 || exit -1
            interval: 10s
            timeout: 5s
            retries: 5
        depends_on:
            zookeeper:
                condition: service_healthy
        networks:
            - local

    # schemaregistry:
    #     container_name: schemaregistry
    #     image: confluentinc/cp-schema-registry:7.6.0
    #     depends_on:
    #         - kafka
    #     networks:
    #         - local 

    # kafka-connect:
    #     container_name: kafka-connect
    #     image: confluentinc/cp-kafka-connect:7.6.0
    #     depends_on:
    #         - kafka
    #         - schemaregistry
    #     networks:
    #         - local

    ##########################################
    ## Services
    ##########################################
    host-client:
        container_name: host-client
        build:
            context: ./src/WebApp
            dockerfile: apps/host/Dockerfile
        restart: on-failure
        environment:
            - NODE_ENV=production
            - ASSET_DIR=/usr/share/nginx/html
            - APP_PREFIX=APP_
            - APP_KEYCLOAK_URL=http://localhost:5101
            - APP_KEYCLOAK_REALM=ecobay
            - APP_KEYCLOAK_CLIENT_ID=web-client
            - APP_API_URL=http://localhost:5100
            - APP_ORDER_URL=http://localhost:4401
        ports:
            - 4400:80
        networks:
            - local
    
    order-client:
        container_name: order-client
        build:
            context: ./src/WebApp
            dockerfile: apps/order/Dockerfile
        restart: on-failure
        environment:
            - NODE_ENV=production
            - ASSET_DIR=/usr/share/nginx/html
            - APP_PREFIX=APP_
            - APP_KEYCLOAK_URL=http://localhost:5101
            - APP_KEYCLOAK_REALM=ecobay
            - APP_KEYCLOAK_CLIENT_ID=web-client
            - APP_API_URL=http://localhost:5100
            - APP_HOST_URL=http://localhost:4400
        ports:
            - 4401:80
        networks:
            - local

    web-apigateway:
        profiles: [ services, minimal-workflow, all ]
        container_name: web-apigateway
        image: ${DOCKER_REGISTRY-}webapigateway
        build:
            context: .
            dockerfile: src/Services/ApiGateways/Web.ApiGateway/Dockerfile
        healthcheck:
            test: curl --fail https://web-apigateway/hc || exit 1
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - local
        logging:
            driver: fluentd
            options:
                fluentd-async: "true"
                tag: host.web-apigateway

    pg-eventstore-db:
        profiles: [ events-store, minimal-workflow, services, all ]
        container_name: pg-eventstore-db
        image: postgres:15-alpine
        healthcheck:
            test: pg_isready -U postgres -d postgres
            interval: 10s
            timeout: 3s
            retries: 3
        networks:
            - local
    
    # Order
    order-api:
        profiles: [ events-store, minimal-workflow, services, all ]
        container_name: order-api
        image: ${DOCKER_REGISTRY-}orderapi
        build:
            context: .
            dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
        healthcheck:
            test: curl --fail https://order-api/hc || exit 1
            interval: 10s
            timeout: 5s
            retries: 3
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        networks:
            - local
        logging:
            driver: fluentd
            options:
                fluentd-async: "true"
                tag: host.order
    
    keycloak:
        profiles: [ services, minimal-workflow, all ]
        container_name: keycloak
        image: quay.io/keycloak/keycloak:latest
        restart: on-failure
        volumes:
            - ./configs/keycloak/:/opt/keycloak/data/import
        command:
            - start-dev
            #- --import-realm
        networks:
            - local
        depends_on:
            mysql-db:
                condition: service_healthy

    # mysql db. using service per schema
    mysql-db:
        profiles: [ services, minimal-workflow, all ]
        container_name: mysql-db
        image: mysql:8.0.34
        healthcheck:
            test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
            timeout: 20s
            retries: 5
        restart: on-failure
        volumes:
            - ./configs/keycloak/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql
        networks:
            - local

    # Product
    product-api:
        profiles: [ services, minimal-workflow, all ]
        container_name: product-api
        image: ${DOCKER_REGISTRY-}productapi
        build:
            context: .
            dockerfile: src/Services/Product/Product.API/Dockerfile
        healthcheck:
            test: curl --fail https://product-api/hc || exit 1
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - local
        logging:
            driver: fluentd
            options:
                fluentd-async: "true"
                tag: host.product-1

    mongo-db:
        profiles: [ minimal-workflow, all ]
        container_name: mongo-db
        image: mongo:7.0.9
        volumes:
            - ./configs/mongodb/product.json:/seed/product.json
            - ./configs/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
            - ./configs/mongodb/init.sh:/docker-entrypoint-initdb.d/init.sh
        networks:
            - local

    ##########################################
    ## Monitoring
    ##########################################
    fluent-bit:
        profiles: [ logging, all ]
        container_name: fluent-bit
        image: fluent/fluent-bit:2.2.2
        volumes:
            - ./configs/fluent-bit:/fluent-bit/etc
        networks:
            - local

    ## Fluent bit - Elasticsearch, Kibana
    # elasticsearch:
    #     container_name: elasticsearch
    #     image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    #     restart: on-failure
    #     networks:
    #         - local
    #     depends_on:
    #         - fluent-bit

    # kibana:
    #     container_name: kibana
    #     image: docker.elastic.co/kibana/kibana:7.17.18
    #     restart: on-failure
    #     networks:
    #         - local
    #     depends_on:
    #         - fluent-bit
    #         - elasticsearch

    # Fluent bit - Loki, Grafana
    loki:
        profiles: [ logging, all ]
        container_name: loki
        image: grafana/loki:2.9.4
        volumes:
            - ./configs/loki:/etc/loki
        command: "-config.file=/etc/loki/local-config.yaml"
        networks:
            - local
    
    grafana:
        profiles: [ logging, observer, all ]
        container_name: grafana
        image: grafana/grafana:10.2.4
        volumes:
            - ./configs/grafana/provisioning/:/etc/grafana/provisioning/
        networks:
            - local
        depends_on:
            - fluent-bit
            - loki

    # Observer
    prometheus:
        profiles: [ observer, all ]
        container_name: prometheus
        image: prom/prometheus:v2.49.1
        restart: unless-stopped
        volumes:
            - ./configs/prometheus:/etc/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=200h'
            - '--web.enable-lifecycle'
        networks:
            - local
        labels:
            org.label-schema.group: "monitoring"

    nodeexporter:
        profiles: [ observer, all ]
        container_name: nodeexporter
        image: prom/node-exporter:v1.7.0
        restart: unless-stopped
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - '--path.procfs=/host/proc'
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
        networks:
            - local
        labels:
            org.label-schema.group: "monitoring"

    cadvisor:
        profiles: [ observer, all ]
        container_name: cadvisor
        image: gcr.io/google-containers/cadvisor:v0.36.0
        restart: unless-stopped
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
            #- /cgroup:/cgroup:ro #doesn't work on MacOS only for Linux
        networks:
            - local
        labels:
            org.label-schema.group: "monitoring"

    # alertmanager:
    #     container_name: alertmanager
    #     image: prom/alertmanager:v0.26.0
    #     restart: unless-stopped
    #     volumes:
    #         - .configs/alertmanager:/etc/alertmanager
    #     command:
    #         - '--config.file=/etc/alertmanager/config.yml'
    #         - '--storage.path=/alertmanager'
    #     networks:
    #         - local
    #     labels:
    #         org.label-schema.group: "monitoring"

    jaeger:
        profiles: [ tracing, all ]
        image: jaegertracing/all-in-one:latest
        container_name: jaeger
        networks:
            - local

networks:
    local:
        driver: bridge
