    #         CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    #     ports:
    #         - 8083:8083

    ##########################################
    ## Services
    ##########################################
    web-apigateway:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
            # - Logging__Loglevel__Default=Debug
            # - Logging__Loglevel__Microsoft=Debug
            - Kestrel__Endpoints__HTTP__Url=http://0.0.0.0:80
            - Reverseproxy__Clusters__orders__Destinations__default__Address=http://order-api
            - Reverseproxy__Clusters__products__Destinations__default__Address=http://product-api
            - Authentication__MetadataAddress=http://keycloak:8080/realms/ecobay/.well-known/openid-configuration
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
        ports:
            - "5100:80"

    pg-eventstore-db:
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_PASSWORD=1234
        ports:
            - "5432:5432"

    keycloak:
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: 1234
            KC_DB: mysql
            KC_DB_URL_HOST: mysql-db
            KC_DB_SCHEMA: keycloak
            KC_DB_USERNAME: root
            KC_DB_PASSWORD: 1234
            KC_HOSTNAME_STRICT: "false"
            KC_PROXY: "edge"
        ports:
            - "5101:8080"

    mysql-db:
        environment:
            MYSQL_ROOT_PASSWORD: 1234
        ports:
            - "5199:3306"

    # Product
    product-api:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
            - Kestrel__Endpoints__HTTP__Url=http://0.0.0.0:80
            - Mongo__Connection__ConnectionString=mongodb://mongo-db:27017
            - Mongo__Connection__DatabaseName=ecobay
            - Kafka__Producer__ProducerConfig__BootstrapServers=kafka:29092
            - Kafka__Consumer__ConsumerConfig__BootstrapServers=kafka:29092
            - Authentication__MetadataAddress=http://keycloak:8080/realms/ecobay/.well-known/openid-configuration
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
        ports:
            - "5110:80"
    
    # Order
    order-api:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
            - Logging__Loglevel__Default=Information
            - Logging__Loglevel__Microsoft=Warning
            - Kestrel__Endpoints__HTTP__Url=http://0.0.0.0:80
            - ConnectionStrings__Default=Server=mysql-db;Database=ecobay.order;User Id=root;Password=1234;
            - EventStore__ConnectionString=PORT=5432;HOST=pg-eventstore-db;TIMEOUT=15;POOLING=True;MINPOOLSIZE=1;MAXPOOLSIZE=100;COMMANDTIMEOUT=20;DATABASE='postgres';PASSWORD='1234';USER ID='postgres';
            - EventStore__WriteSchema=orders_write
            - Kafka__Producer__ProducerConfig__BootstrapServers=kafka:29092
            - Kafka__Consumer__ConsumerConfig__BootstrapServers=kafka:29092
            - Authentication__MetadataAddress=http://keycloak:8080/realms/ecobay/.well-known/openid-configuration
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
        ports:
            - "5010:80"
    
    mongo-db:
        ports:
            - 27117:27017

    ##########################################
    ## Monitoring
    ##########################################
    fluent-bit:
        environment:
            # - FLB_ES_HOST=elasticsearch
            # - FLB_ES_PORT=9200
            - LOKI_HOST=loki
            - LOKI_PORT=3100
        ports:
            - 24224:24224

    ## Fluent bit - Elasticsearch, Kibana
    # elasticsearch:
    #     mem_limit: 2g
    #     environment:
    #         - discovery.type=single-node
    #     ports:
    #         - 9200:9200
    #         - 9300:9300

    # kibana:
    #     environment:
    #         - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    #     ports:
    #         - 5601:5601
    
    # Fluent bit - Loki, Grafana
    loki:
        ports:
            - 3100:3100

    grafana:
        environment:
              - GF_SECURITY_ADMIN_USER=admin
              - GF_SECURITY_ADMIN_PASSWORD=1234
        ports:
            - 3000:3000

    # Observer
    prometheus:
        expose:
            - 9090

    nodeexporter:
        user: root
        privileged: true
        expose:
            - 9100

    cadvisor:
        expose:
            - 8080

    # alertmanager:
    #     expose:
    #         - 9093

    jaeger:
        ports:
            - "6831:6831/udp"
            - "4317:4317"
            - "4318:4318"
            - "16686:16686"
            - "14268:14268"
            - "14250:14250"